<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lire les scènes — Les Treize Chemins</title><style>
.reader{box-sizing:border-box;width:100%;max-width:none;min-height:100dvh;margin:0;padding:24px clamp(14px,4vw,52px) 70px;background:#fff9ec;color:#30453e;font-family:Georgia,serif}
.reader h1{font-size:clamp(32px,6vw,55px);font-weight:normal}
.reader .card{box-sizing:border-box;width:100%;max-width:860px;background:#fff9ec;border:1px solid #b9a27b;padding:clamp(20px,4vw,45px);margin:22px auto}
.reader blockquote{border-left:3px solid #b38c55;padding:10px 20px;margin:24px 0;font-size:clamp(20px,2.1vw,25px);line-height:1.86}
.reader blockquote p{margin:0 0 1em}.reader blockquote p:last-child{margin-bottom:0}@media(max-width:600px){.reader .card{padding:18px 14px}.reader blockquote{font-size:19px;padding:6px 12px}}
.reader .meta{font:12px sans-serif;color:#786d5b}
.reader .nav{display:flex;gap:12px;flex-wrap:wrap}
.reader a{color:#335c4a}
.reader select{padding:10px;background:#fff9ec;border:1px solid #ad9570;font-size:16px;max-width:100%}
body{margin:0;background:#fff9ec}
</style></head><body><main class="reader">
<nav class="nav"><a href="index.html">⌂ Accueil</a><a href="carte.html">🧭 Carte</a><a href="jeu.html">🎲 Plateau</a><a href="contact.html">Contacter l’auteur</a></nav>
<p class="meta">LA TECTONIQUE DES ÂMES · LE MANUSCRIT DANS LE JEU</p><h1>Le livre des passages</h1>
<p>Chaque niveau est relié à un chapitre.</p>
<label for="stage">Choisir un niveau</label> <select id="stage"></select><div id="reading"></div>
<p class="meta">Les pages renvoient à la mise en page du manuscrit de lecture.</p>
</main><script src="etapes-data.js"></script><script src="escale.js?v=20261109-ch234"></script><script>
const DATA=TreizeEtapesData.flatMap(s=>(s.plateaux||[s]).map(p=>({...p.passage,plateau:p.plateau||1,total:s.plateaux?.length||1})));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const select=document.getElementById('stage');
select.innerHTML=DATA.map(d=>`<option value="${d.level}:${d.plateau}">Niveau ${d.level}${d.total>1?` · Plateau ${d.plateau}/${d.total}`:''} — ${esc(d.scene||d.title)}</option>`).join('');
function render(){const d=DATA.find(d=>`${d.level}:${d.plateau}`===select.value)||DATA[0];document.getElementById('reading').innerHTML=
`<article class="card"><p class="meta">NIVEAU ${d.level}</p>
<h2>${esc(d.scene)}</h2><p class="reference">Extrait du chapitre ${Number(d.chapter)} — <em>« ${esc(d.title)} »</em>, ${esc(d.pageLabel)}.</p>
<p class="meta">Le titre de ce passage a été choisi pour le jeu.</p>
${TreizeEscale.characterButton(d.level,d.plateau)}<blockquote>${d.quote.split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('')}</blockquote>
<p class="meta">${esc(d.source)}</p>
<div class="nav"><a href="carte.html?niveau=${d.level}&plateau=${d.plateau}">🧭 Voir sur la carte</a><a href="jeu.html?niveau=${d.level}&plateau=${d.plateau}">🎲 Relever l'épreuve</a></div></article>`;TreizeEscale.bindCharacters(document.getElementById('reading'));}
select.onchange=render;let n=Number(new URLSearchParams(location.search).get('niveau'));const p=Number(new URLSearchParams(location.search).get('plateau'))||1;select.value=DATA.some(d=>d.level===n&&d.plateau===p)?`${n}:${p}`:'1:1';render();
</script></body></html>
