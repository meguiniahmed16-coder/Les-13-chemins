name: Atelier - TripoSR CPU
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-inference:
    if: github.event_name != 'pull_request' || github.head_ref == 'atelier-triposr-cpu'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install official engine and CPU dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          git init "$RUNNER_TEMP/TripoSR"
          cd "$RUNNER_TEMP/TripoSR"
          git remote add origin https://github.com/VAST-AI-Research/TripoSR.git
          git fetch --depth 1 origin 107cefdc244c39106fa830359024f6a2f1c78871
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
          python -m pip install "numpy<2" "rembg==2.0.59" "onnxruntime"
          grep -vE "torchmcubes|^gradio$" requirements.txt > requirements-cpu.txt
          python -m pip install -r requirements-cpu.txt "numpy<2" "rembg==2.0.59" "scikit-image==0.24.0" "huggingface-hub<1" "opencv-python-headless<4.12"
          cp "$GITHUB_WORKSPACE/tools/incarnations-triposr/torchmcubes.py" ./torchmcubes.py
      - name: Generate a real 192-resolution portrait through the private HTTP server
        run: |
          python tools/incarnations-triposr/test_http.py --engine "$RUNNER_TEMP/TripoSR" --output "$RUNNER_TEMP/atelier-output/0/mesh.glb"
      - uses: actions/upload-artifact@v4
        with:
          name: TripoSR-original-CPU-GLB
          path: ${{ runner.temp }}/atelier-output/0/mesh.glb
          if-no-files-found: error
          retention-days: 3
