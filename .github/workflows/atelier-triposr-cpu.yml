name: Atelier - TripoSR CPU
on:
  push:
    branches: [atelier-triposr-cpu]
    paths:
      - '.github/workflows/atelier-triposr-cpu.yml'
      - 'tools/incarnations-triposr/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-inference:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install official engine and CPU dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git "$RUNNER_TEMP/TripoSR"
          cd "$RUNNER_TEMP/TripoSR"
          git rev-parse HEAD
          python -m pip install "numpy<2" "cmake" "ninja" "pybind11" "rembg[cpu]==2.0.59"
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Run original inference on public upstream example
        run: |
          cd "$RUNNER_TEMP/TripoSR"
          python run.py examples/chair.png --device cpu --chunk-size 2048 --mc-resolution 128 --output-dir "$RUNNER_TEMP/atelier-output" --model-save-format glb
          python -c "import pathlib,struct; b=pathlib.Path('$RUNNER_TEMP/atelier-output/0/mesh.glb').read_bytes(); assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b); print('Real GLB:',len(b),'bytes')"
      - uses: actions/upload-artifact@v4
        with:
          name: TripoSR-original-CPU-GLB
          path: ${{ runner.temp }}/atelier-output/0/mesh.glb
          if-no-files-found: error
          retention-days: 3
