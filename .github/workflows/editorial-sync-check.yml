name: Vérifier la synchronisation éditoriale privée
on:
  push:
    branches: [main]
    paths:
      - 'plugins/editorial-private-sync/**'
      - '.github/workflows/editorial-sync-check.yml'
      - 'editorial-sync.envelope.json'
      - 'netlify.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-transfer-key:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier uniquement la clé publique du déploiement existant
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { createPublicKey } from 'node:crypto';
          const url = 'https://tectonique-des-ames.netlify.app/editorial-sync-key.json';
          try {
            const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000), headers: {'Cache-Control':'no-cache'} });
            console.log('HTTP ' + response.status);
            if (!response.ok) { console.log('Le déploiement ne fournit pas encore la clé publique de transfert. Aucun document synchronisé par ce contrôle.'); process.exitCode = 1; }
            else {
              const data = await response.json();
              if (!/^[a-f0-9]{64}$/.test(data.keyId || '') || typeof data.publicKey !== 'string' || data.publicKey.length > 2000 || !data.publicKey.startsWith('-----BEGIN PUBLIC KEY-----')) throw new Error('invalid public key');
              createPublicKey(data.publicKey);
              console.log(JSON.stringify({version: 1, keyId: data.keyId, publicKey: data.publicKey}));
            }
          } catch { console.log('Contrôle distant non abouti. Aucun code d’accès demandé ou modifié.'); process.exitCode = 1; }
          JS
