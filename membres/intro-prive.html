<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#203c30"><title>La Croisée des Âmes · Scènes originales</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfbf8;color:#243b2d;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;padding:9px 12px;border-radius:9px;border:1px solid #abc0b0;background:#fdfdf7;color:#254330;min-height:39px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b8995c}button:disabled{opacity:.5}a{color:inherit}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:8px 14px;background:#203b30;color:#fff;z-index:8}header strong{font:normal clamp(16px,2.7vw,24px) Georgia,serif}header small{display:block;opacity:.75;font-size:11px}header a{color:white;text-decoration:none;font-size:12px;border:1px solid #637f6d;border-radius:9px;padding:8px}
#stage{position:relative;min-height:0;overflow:hidden;background:#fff}#scene{width:100%;height:100%;display:block;touch-action:none}
#status{position:absolute;top:12px;left:12px;background:#fffffff0;border:1px solid #d7ddd5;border-radius:20px;padding:6px 12px;font-size:12px;z-index:3;max-width:85vw;pointer-events:none}
#joystick{position:absolute;left:15px;bottom:17px;width:82px;height:82px;border:2px solid #fff9;border-radius:50%;background:#22432eaa;z-index:7;display:grid;place-items:center;touch-action:none}#joystick #nub{width:34px;height:34px;border-radius:50%;background:#fffdf0e8;box-shadow:0 3px 8px #0003;pointer-events:none}
#garden{position:absolute;inset:0;z-index:4;background:#203a30}#garden-frame{width:100%;height:100%;border:0}
#loading,#welcome,#access-denied{position:absolute;inset:0;z-index:11;background:#fdfdf9f5;display:grid;place-content:center;justify-items:center;text-align:center;gap:15px;padding:20px}#welcome h1{font:normal clamp(32px,6vw,58px) Georgia,serif;margin:0}#welcome p{max-width:530px;font-size:15px;line-height:1.5;margin:0}#welcome input{padding:12px;min-width:min(320px,82vw);background:#fff;border:1px solid #a2b6a4;border-radius:9px;text-align:center}#loading{font-size:15px}#access-denied{font-size:17px}[hidden]{display:none!important}
footer{padding:7px 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;background:#f1f3ed;border-top:1px solid #cad1c8;z-index:8}.controls{display:flex;gap:6px;flex-wrap:wrap}.primary{background:#264c36;color:white;border-color:#264c36}
dialog{width:min(560px,94vw);max-height:90vh;overflow:auto;border:0;border-radius:16px;box-shadow:0 16px 60px #0006;padding:20px;color:#23402d}dialog::backdrop{background:#0009}dialog h2{font:normal 28px Georgia,serif;margin:0 0 13px}dialog label{display:grid;gap:6px;margin:12px 0}dialog textarea,dialog select,dialog input{width:100%;border:1px solid #a7bcae;border-radius:8px;padding:10px}dialog textarea{min-height:100px}dialog .actions{display:flex;gap:7px;flex-wrap:wrap}dialog small{color:#66796b;font-size:12px}
@media(max-width:650px){header{padding:7px}header strong{font-size:17px}#joystick{width:70px;height:70px}footer{padding:5px}footer button{min-height:35px;font-size:12px;padding:6px 8px}}

#loading{overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 25%,#759a83 0,#234c40 43%,#142e29 78%);color:#fffdf4;gap:clamp(12px,3vh,30px);align-content:center;justify-content:center;}
.load-art{position:relative;width:min(210px,45vw,30vh);aspect-ratio:1;display:grid;place-items:center}
.portal{position:relative;overflow:hidden;width:74%;height:95%;border-radius:49% 49% 6px 6px;background:linear-gradient(170deg,#f8e9bf,#e9b982 48%,#648578 49%,#426f60 75%,#315347);border:1px solid #f5dfb5b0;box-shadow:0 0 55px #f7de9b3d,0 18px 55px #10292288;}
.portal:before{content:'';position:absolute;width:38%;aspect-ratio:1;border-radius:50%;background:#fff3c7;top:25%;left:30%;box-shadow:0 0 28px #ffe7ab;}
.horizon{position:absolute;inset:49% -15% 0;background:#719486;clip-path:polygon(0 30%,24% 4%,43% 25%,63% 0,100% 33%,100% 100%,0 100%);}
.path{position:absolute;inset:51% 0 0;background:linear-gradient(#e9d4b4,#a5a383);clip-path:polygon(47% 0,52% 0,64% 32%,42% 59%,71% 100%,12% 100%,32% 59%,54% 32%);}
.portal i{position:absolute;top:20%;left:20%;width:14px;height:9px;border-top:1.5px solid #fdf3d1;border-radius:50%;transform:rotate(-17deg)}.portal i:nth-of-type(2){top:37%;left:65%;transform:rotate(15deg) scale(.7)}.portal i:nth-of-type(3){top:13%;left:57%;transform:scale(.5)}
.load-panel{display:grid;justify-items:center;gap:9px;width:min(350px,83vw)}.load-kicker{font-size:10px;letter-spacing:.22em;color:#e0dfc5}
.load-panel h1{font:normal clamp(28px,5vw,42px) Georgia,serif;margin:0}.load-panel p{margin:0 0 7px;color:#e0e8df;font-size:14px}
#load-progress{width:100%;height:7px;appearance:none;border:none;border-radius:999px;background:#ffffff30;overflow:hidden;accent-color:#e7cfa0}#load-progress::-webkit-progress-bar{background:#ffffff30;border-radius:999px}#load-progress::-webkit-progress-value{background:#e7cfa0;border-radius:999px;transition:width .35s}#load-progress::-moz-progress-bar{background:#e7cfa0;border-radius:999px}
#load-percent{font-size:12px;font-variant-numeric:tabular-nums;color:#eee5c9}#retry-load{margin-top:8px;background:#f7e8c8;border:0;color:#203b30}
#welcome{background:#fdfcf3b0;backdrop-filter:blur(5px);padding:20px}.welcome-panel{background:#fffdf4ed;border:1px solid #e0dfce;border-radius:22px;box-shadow:0 12px 60px #19382b20;display:grid;justify-items:center;gap:22px;padding:clamp(20px,5vw,42px);width:min(480px,92vw);text-align:center}.welcome-panel h1{font:normal clamp(32px,6vw,55px)/1.13 Georgia,serif;color:#243e31;margin:0}.welcome-panel label{display:grid;gap:9px;width:100%;text-align:center}.welcome-panel input{width:100%;min-width:0!important}.welcome-panel button{min-width:140px;font-weight:600}
#scene-wait{position:absolute;z-index:9;bottom:7px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:10px 14px;border-radius:12px;background:#203b30e8;color:#fff;text-align:center}
@media(max-height:450px){#loading{grid-template-columns:auto auto;gap:20px}.load-art{width:min(120px,25vw)}.welcome-panel{padding:16px;gap:9px}.welcome-panel h1{font-size:28px}}

/* A real speech bubble lives beside its speaker, inside the scene. Its body
   stays still for the complete reply; only the small pointer follows a face. */
#bubble{position:absolute;left:0;top:0;width:390px;max-width:calc(100% - 28px);padding:12px 17px;border:1px solid #9cab9e;border-radius:23px;z-index:5;background:#fffffff7;box-shadow:0 5px 22px #213a2d24;pointer-events:none;color:#20392d;visibility:hidden}
#bubble b{font:700 10px system-ui;letter-spacing:.07em;text-transform:uppercase;color:#52725c}
#bubble p{font:clamp(16px,1.8vw,20px)/1.35 Georgia,serif;margin:5px 0 1px;white-space:pre-line;overflow-wrap:anywhere}
#bubble:after{content:'';position:absolute;left:var(--tail-x,50%);top:100%;width:17px;height:17px;background:#fff;transform:translate(-50%,-8px) rotate(45deg);border-right:1px solid #9cab9e;border-bottom:1px solid #9cab9e}
#bubble.below:after{top:0;transform:translate(-50%,-9px) rotate(225deg)}
#bubble.left:after{left:100%;top:var(--tail-y,50%);transform:translate(-8px,-50%) rotate(-45deg)}
#bubble.right:after{left:0;top:var(--tail-y,50%);transform:translate(-9px,-50%) rotate(135deg)}
@media(max-width:650px){#bubble{padding:10px 13px;border-radius:20px}#bubble p{font-size:16px}}
@media(max-height:350px){#bubble{padding:8px 12px}#bubble p{font-size:15px;line-height:1.25}}

#film-montage{position:absolute;inset:0;z-index:6;overflow:hidden;background:#183129;color:#fff;pointer-events:none}
#film-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#142b27}
#cinema-fade{position:absolute;inset:0;background:white;z-index:10;opacity:0;pointer-events:none}

</style><link rel="stylesheet" href="/membres/intro-dojo-ui.css?v=croisee27"><link rel="stylesheet" href="/membres/intro-arrival.css?v=croisee27"></head>
<body><div id="app"><header><div><strong>La Croisée des Âmes</strong></div><a href="/admin-blog.html?view=dashboard">Administration</a></header>
<main id="stage"><canvas id="scene" aria-label="Scène cinématographique 3D et dojo original"></canvas><div id="bubble" hidden aria-live="polite" aria-atomic="true"></div><div id="status" hidden></div><div id="scene-wait" hidden role="status"></div><div id="film-montage" hidden><video id="film-video" playsinline muted preload="auto" disablepictureinpicture aria-label="Le salon, les dés roulant sur le plateau et le jardin avec ses papillons"></video></div><div id="cinema-fade" aria-hidden="true"></div>
<div id="joystick" hidden aria-label="Joystick pour se déplacer dans le dojo"><div id="nub"></div></div>
<div id="garden" hidden><iframe id="garden-frame" title="Le véritable jardin 3D et la maison" allow="fullscreen"></iframe></div>
<div id="loading"><div class="load-art" aria-hidden="true"><div class="portal"><div class="horizon"></div><div class="path"></div><i></i><i></i><i></i></div></div><div class="load-panel"><div class="load-kicker">LA CROISÉE DES ÂMES</div><h1 id="load-title">Un instant…</h1><p id="load-description">La rencontre se prépare.</p><progress id="load-progress" max="100" value="0" aria-label="Chargement de la rencontre"></progress><span id="load-percent">0 %</span><button id="retry-load" type="button" hidden>Réessayer</button><small id="load-error-details" hidden style="max-width: min(350px,82vw);overflow-wrap:anywhere;color:#e0e8df;font-size:11px;line-height:1.4"></small></div></div>
<div id="welcome" hidden><div class="welcome-panel"><h1>Qu’est-ce qu’une rencontre ?</h1><label>Ton prénom ou pseudonyme<input id="pseudo" maxlength="40" autocomplete="nickname" placeholder="Ton pseudonyme"></label><button class="primary" id="enter" disabled>Commencer</button></div></div>
<div id="access-denied" hidden><h2>Accès réservé à l’auteur</h2><p>Connecte-toi à ton administration pour accéder à ce monde.</p><a href="/admin-blog.html">Administration</a></div>
</main>
<footer><button type="button" id="report-open">Signaler une erreur</button><button type="button" id="skip" disabled>Passer l’introduction</button></footer>
<dialog id="report-dialog"><h2>Rapport de test</h2><label>Type<select id="report-type"><option value="bug">Signaler un problème</option><option value="amelioration">Demander une amélioration</option></select></label><label>Scène<input id="report-scene" readonly></label><label>Observation<textarea id="report-note" placeholder="Décris le problème ou la modification souhaitée."></textarea></label><small id="report-count"></small><div class="actions"><button id="report-add">Ajouter</button><button id="report-export" class="primary">Télécharger le rapport JSON</button><button id="report-close">Fermer</button></div></dialog>
</div><script type="module" src="/membres/intro-cinema-croisee27.js"></script></body></html>
