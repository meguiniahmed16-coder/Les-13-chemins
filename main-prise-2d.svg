<path d="M267 230 C273 240 270 257 254 268 C237 282 220 289 201 289
C183 289 174 283 176 274 C177 264 188 261 202 260 C223 257 239 236 249 226
C257 219 263 222 267 230Z" fill="url(#skin)" stroke="#805641" stroke-width="3" stroke-linejoin="round"/>
