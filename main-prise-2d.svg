<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-label="Main serrant un manche vertical, doigts visibles">
<defs><linearGradient id="skin" x1="0" y1="0" x2="1" y2=".1"><stop stop-color="#9b6c53"/><stop offset=".25" stop-color="#cb9d7d"/><stop offset=".59" stop-color="#e0b08e"/><stop offset="1" stop-color="#a27457"/></linearGradient>
<linearGradient id="finger" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#92664e"/><stop offset=".2" stop-color="#c39171"/><stop offset=".52" stop-color="#e3b18d"/><stop offset="1" stop-color="#ad785b"/></linearGradient>
