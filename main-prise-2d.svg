<path d="M153 154 Q162 159 165 169 M146 188 Q155 194 155 200 M156 222 Q166 225 168 232 M174 254 Q181 260 182 268" stroke="#835a42" stroke-width="2.7" opacity=".60" fill="none" stroke-linecap="round"/>
