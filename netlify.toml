# Adresse publique principale : https://tectonique-des-ames.com.
# La liaison GitHub et la branche de production main se règlent dans Netlify.
[build]
  command = "node build-public.mjs"
  publish = "dist"
functions = ".netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
node_bundler = "esbuild"

[[headers]]
for = "/editeurs*"
[headers.values]
Cache-Control = "private, no-store"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
for = "/contact*"
[headers.values]
Cache-Control = "private, no-store"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
for = "/admin*"
[headers.values]
Cache-Control = "private, no-store"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-Robots-Tag = "noindex, nofollow"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

# The administrator UI is served locally; its API verifies the secure session.
[[headers]]
for = "/admin-blog.html"
[headers.values]
Cache-Control = "private, no-store"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-Robots-Tag = "noindex, nofollow"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

# Keep old bookmarks and every public page on the canonical origin.
[[redirects]]
from = "https://tectonique-des-ames.netlify.app/*"
to = "https://tectonique-des-ames.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://tectonique-des-ames.netlify.app/*"
to = "https://tectonique-des-ames.com/:splat"
status = 301
force = true

