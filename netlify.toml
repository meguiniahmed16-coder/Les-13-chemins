# Configuration du site existant tectonique-des-ames.netlify.app.
# La liaison GitHub et la branche de production main se règlent dans Netlify.
[build]
  command = "node build-public.mjs"
  publish = "dist"
functions = ".netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
node_bundler = "esbuild"

[[headers]]
for = "/editeurs*"
[headers.values]
Cache-Control = "private, no-store"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
for = "/contact*"
[headers.values]
Cache-Control = "private, no-store"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
for = "/admin*"
[headers.values]
Cache-Control = "private, no-store"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-Robots-Tag = "noindex, nofollow"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

# Synchronisation des documents privés déclenchée par les commits GitHub main.
# Les fichiers et les URL source ne sont jamais enregistrés en clair dans Git.
[[plugins]]
package = "./plugins/editorial-private-sync"
